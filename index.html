<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constancia de atención</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--fg:#1c2733;--mut:#5d6b7a;--line:#d5dce3;--acc:#0b6e6e;--acc-fg:#fff;--err:#b3261e;--ok:#1b7a3d}
  @media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18212a;--fg:#e8edf2;--mut:#9aa8b6;--line:#2b3846;--acc:#3fb5b5;--acc-fg:#06201f;--err:#ff8a80;--ok:#6fd08c}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  main{max-width:520px;margin:0 auto}
  h1{font-size:1.4rem;margin:8px 0 2px}
  .sub{color:var(--mut);margin:0 0 16px}
  form,.done{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px}
  label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
  input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .sigbox{border:1.5px dashed var(--line);border-radius:8px;background:#fff;position:relative;touch-action:none}
  canvas{display:block;width:100%;height:180px;touch-action:none}
  .sigbox .hint{position:absolute;inset:0;display:grid;place-items:center;color:#8a96a3;pointer-events:none;font-size:.95rem}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
  .chk input{width:auto;margin-top:5px}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
  .primary{background:var(--acc);color:var(--acc-fg)}
  .link{background:none;color:var(--acc);padding:4px 0}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--err);min-height:1.2em;margin:0;font-size:.92rem}
  .done h2{margin:0;color:var(--ok)}
  small{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1 id="titulo">Constancia de atención</h1>
  <p class="sub" id="sub"></p>

  <form id="f" novalidate>
    <label>Apellido y nombre
      <input id="nombre" autocomplete="name" required maxlength="120">
    </label>
    <label>DNI (solo números)
      <input id="dni" inputmode="numeric" autocomplete="off" required maxlength="9" placeholder="12345678">
    </label>
    <label>Fecha de atención
      <input id="fecha" type="date" required>
    </label>
    <label>Motivo de consulta (opcional)
      <textarea id="motivo" rows="2" maxlength="300"></textarea>
    </label>

    <div>
      <div class="row" style="margin-bottom:6px">
        <strong style="font-size:.95rem">Firma</strong>
        <button type="button" class="link" id="borrar">Borrar firma</button>
      </div>
      <div class="sigbox">
        <canvas id="pad" aria-label="Espacio para firmar con el dedo"></canvas>
        <div class="hint" id="hint">Firmá acá con el dedo</div>
      </div>
    </div>

    <label class="chk">
      <input type="checkbox" id="acepta">
      <span>Confirmo que fui atendido/a en la fecha indicada y que los datos son correctos.</span>
    </label>

    <p class="err" id="err" role="alert"></p>
    <button class="primary" id="enviar" type="submit">Firmar y enviar</button>
    <small>Tus datos son confidenciales y los usa únicamente el consultorio para el registro de atención.</small>
  </form>

  <section class="done" id="done" hidden>
    <h2>Constancia enviada</h2>
    <p>Gracias. Tu firma quedó registrada. Ya podés cerrar esta página.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== CONFIGURAR ======
const SUPABASE_URL = "https://pqyobznfmiehrwmypgiz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeW9iem5mbWllaHJ3bXlwZ2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzczNjQsImV4cCI6MjEwODM1MzM2NH0.z0EWix4-hmNU7_HNmOGDX19wjGGA7BwrVL0bIPWKlDw";
const CONSULTORIO = "Consultorio médico";   // aparece debajo del título
// ========================

const $ = id => document.getElementById(id);
$("sub").textContent = CONSULTORIO;
$("fecha").value = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- Firma ----
const cv = $("pad"), ctx = cv.getContext("2d");
let dibujando = false, hayFirma = false, last = null;
function ajustar(){
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width*d; cv.height = r.height*d;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,r.width,r.height);
  ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111";
  hayFirma=false; $("hint").hidden=false;
}
function pos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);dibujando=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.01,last.y);ctx.stroke();hayFirma=true;$("hint").hidden=true;});
cv.addEventListener("pointermove",e=>{if(!dibujando)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>dibujando=false));
$("borrar").onclick=ajustar;
window.addEventListener("load",ajustar);

// ---- Envío ----
$("f").addEventListener("submit", async e=>{
  e.preventDefault();
  const err = $("err"); err.textContent="";
  const nombre=$("nombre").value.trim(), dni=$("dni").value.replace(/\D/g,""), fecha=$("fecha").value, motivo=$("motivo").value.trim();
  if(nombre.length<3) return err.textContent="Ingresá tu apellido y nombre.";
  if(!/^\d{6,9}$/.test(dni)) return err.textContent="El DNI debe tener entre 6 y 9 números.";
  if(!fecha) return err.textContent="Indicá la fecha de atención.";
  if(!hayFirma) return err.textContent="Falta tu firma.";
  if(!$("acepta").checked) return err.textContent="Tildá la confirmación para continuar.";

  const btn=$("enviar"); btn.disabled=true; btn.textContent="Enviando…";
  const { error } = await db.from("constancias").insert({
    apellido_nombre:nombre, dni, fecha_atencion:fecha, motivo:motivo||null,
    firma:cv.toDataURL("image/png"), acepta:true
  });
  if(error){ btn.disabled=false; btn.textContent="Firmar y enviar"; err.textContent="No se pudo enviar. Revisá tu conexión e intentá de nuevo."; console.error(error); return; }
  $("f").hidden=true; $("done").hidden=false;
});
</script>
</body>
</html>
