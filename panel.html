<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Planilla de atención</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--fg:#1c2733;--mut:#5d6b7a;--line:#d5dce3;--acc:#0b6e6e;--acc-fg:#fff;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18212a;--fg:#e8edf2;--mut:#9aa8b6;--line:#2b3846;--acc:#3fb5b5;--acc-fg:#06201f;--err:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  main{max-width:1000px;margin:0 auto}
  h1{font-size:1.3rem;margin:4px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  input{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--acc);color:var(--acc-fg)}
  button.sec{background:none;color:var(--acc);border:1px solid var(--line)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .bar input[type=search]{flex:1;min-width:180px}
  .login{display:grid;gap:10px;max-width:340px}
  .err{color:var(--err);margin:0;min-height:1.2em}
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  td img{height:44px;background:#fff;border:1px solid var(--line);border-radius:4px;display:block}
  .cnt{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Planilla de atención</h1>

  <section class="card login" id="login">
    <input id="mail" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="entrar">Ingresar</button>
    <p class="err" id="lerr" role="alert"></p>
  </section>

  <section class="card" id="app" hidden>
    <div class="bar">
      <input id="q" type="search" placeholder="Buscar por nombre o DNI">
      <input id="desde" type="date" aria-label="Desde">
      <input id="hasta" type="date" aria-label="Hasta">
      <button id="csv">Descargar Excel (CSV)</button>
      <button class="sec" id="salir">Salir</button>
    </div>
    <p class="cnt" id="cnt"></p>
    <div class="tw">
      <table>
        <thead><tr><th>Fecha</th><th>Apellido y nombre</th><th>DNI</th><th>Motivo</th><th>Firma</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== CONFIGURAR (mismos datos que index.html) ======
const SUPABASE_URL = "https://pqyobznfmiehrwmypgiz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeW9iem5mbWllaHJ3bXlwZ2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzczNjQsImV4cCI6MjEwODM1MzM2NH0.z0EWix4-hmNU7_HNmOGDX19wjGGA7BwrVL0bIPWKlDw";
// ======================================================

const $ = id => document.getElementById(id);
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let filas = [];

async function cargar(){
  const { data, error } = await db.from("constancias").select("*").order("creado_en",{ascending:false}).limit(2000);
  if(error){ $("cnt").textContent="Error al cargar: "+error.message; return; }
  filas = data; pintar();
}
function filtradas(){
  const q=$("q").value.trim().toLowerCase(), d=$("desde").value, h=$("hasta").value;
  return filas.filter(r=>(!q||r.apellido_nombre.toLowerCase().includes(q)||r.dni.includes(q))&&(!d||r.fecha_atencion>=d)&&(!h||r.fecha_atencion<=h));
}
function fmt(f){const [y,m,d]=f.split("-");return `${d}/${m}/${y}`;}
function pintar(){
  const fs=filtradas(); $("cnt").textContent=fs.length+" registro(s)";
  const tb=$("tb"); tb.textContent="";
  for(const r of fs){
    const tr=document.createElement("tr");
    [fmt(r.fecha_atencion), r.apellido_nombre, r.dni, r.motivo||""].forEach(t=>{const td=document.createElement("td");td.textContent=t;tr.appendChild(td);});
    const td=document.createElement("td"), img=document.createElement("img"); img.src=r.firma; img.alt="Firma"; td.appendChild(img); tr.appendChild(td);
    tb.appendChild(tr);
  }
}
["q","desde","hasta"].forEach(id=>$(id).addEventListener("input",pintar));

$("csv").onclick=()=>{
  const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lineas=[["Fecha de atención","Apellido y nombre","DNI","Motivo","Registrada (fecha y hora)","Firma"].map(esc).join(";")];
  for(const r of filtradas()) lineas.push([fmt(r.fecha_atencion),r.apellido_nombre,r.dni,r.motivo,new Date(r.creado_en).toLocaleString("es-AR"),"Firmada (ver panel)"].map(esc).join(";"));
  const blob=new Blob(["﻿"+lineas.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="planilla-atencion.csv"; a.click();
};

async function estado(){
  const { data:{ session } } = await db.auth.getSession();
  $("login").hidden=!!session; $("app").hidden=!session;
  if(session) cargar();
}
$("entrar").onclick=async()=>{
  $("lerr").textContent="";
  const { error } = await db.auth.signInWithPassword({email:$("mail").value.trim(),password:$("pass").value});
  if(error) $("lerr").textContent="Email o contraseña incorrectos."; else estado();
};
$("salir").onclick=async()=>{ await db.auth.signOut(); estado(); };
estado();
</script>
</body>
</html>
